<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You, Best Friend</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="portfolio wrapper-table">
    <div class="wrapper-vertical">	
      <div class="wrapper-horizontal">
        <div class="wrapper-square">
          <div class="wrapper-square-dummy"></div>
          <div class="wrapper-square-element">
            
            <div class="bk-book bk-bookdefault" id="magazine">
              
              <div class="bk-front">
                <div class="bk-cover magazine-cover">
                  
                  <div class="magazine-grid">
                    <h1 class="mag-main-title">BIRTHDAY</h1>
                    
                    <div class="mag-meta">
                      <span class="mag-date">FEBRUARY 2026</span>
                      <span class="mag-edition">LIMITED EDITION</span>
                    </div>
                    
                    <div class="mag-issue">
                      <h2>17th</h2>
                      <p>edition</p>
                    </div>
                    
                    <div class="mag-badge">
                      <svg viewBox="0 0 24 24" class="sparkle-icon">
                        <path d="M12,2L14.7,8.6L21,11L14.7,13.4L12,20L9.3,13.4L3,11L9.3,8.6L12,2Z"/>
                      </svg>
                    </div>
                    
                    <div class="mag-promo">
                      <h2>ICONIC</h2>
                      <p>AT EVERY ANGLE</p>
                    </div>
                    
                    <h2 class="mag-hero-name">NAME</h2>
                    
                    <div class="mag-barcode">
                      <div class="barcode-lines"></div>
                      <span class="barcode-text">0123A456B-789(C)</span>
                    </div>
                  </div>

                </div>
                <div class="bk-cover-back"></div>
              </div>
              
              <div class="bk-page">
                <div class="bb-bookblock" id="bb-bookblock">
                  
                  <div class="bb-item clearfix">
                    <div class="page-content left-page">
                      <div class="page-inner">
                        <h2>Happy Birthday!</h2>
                        <p>Здесь может быть твой первый текст или поздравление...</p>
                      </div>
                    </div>
                    <div class="page-content right-page">
                      <div class="page-inner">
                        <img src="photo1.jpg" alt="Фото 1" class="page-img">
                      </div>
                    </div>
                  </div>
                  
                  <div class="bb-item clearfix">
                    <div class="page-content left-page">
                      <div class="page-inner">
                        <img src="photo2.jpg" alt="Фото 2" class="page-img">
                      </div>
                    </div>
                    <div class="page-content right-page">
                      <div class="page-inner">
                        <h2>Ты самая лучшая</h2>
                        <p>И ещё немного тёплых слов для лучшей подруги.</p>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
              
              <div class="bk-back bk-bookback">
                <div class="wrapper-table back-cover-content">
                  <h1>THE END</h1>
                </div>
              </div>
              
              <div class="bk-right"></div>
              <div class="bk-left"></div>
              <div class="bk-top"></div>
              <div class="bk-bottom"></div>
              
            </div> </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <script src="js/jquerypp.custom.js"></script>
  <script src="js/jquery.bookblock.js"></script>
  <script src="script.js"></script>
</body>
</html>
